<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMA Stock Manager — DEV</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding-bottom:40px}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:20}header h1{margin:0;font-size:21px}.wrap{max-width:1150px;margin:auto;padding:16px}.moreGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{position:relative;background:#fff;border:1px solid #dde6e9;border-radius:24px;padding:26px 16px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;box-shadow:0 3px 12px #18324a10;cursor:pointer}.tileIcon{width:86px;height:86px;border-radius:24px;display:grid;place-items:center;font-size:42px}.orange .tileIcon{background:#fff0e5}.teal .tileIcon{background:#e7f5f5}.badge{position:absolute;right:16px;top:14px;background:#f47a2a;color:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:900}.teal .badge{background:#2e8790}.title{font-size:21px;font-weight:900;color:#18324a}.desc{font-size:12px;color:#71808a;text-align:center}.dev{background:#b45309;color:#fff;text-align:center;padding:8px;font-size:11px;font-weight:900}@media(max-width:560px){.moreGrid{grid-template-columns:1fr}.tile{min-height:175px}.title{font-size:18px}}</style></head><body><div class="dev">🧪 ENVIRONNEMENT DE DÉVELOPPEMENT · GAMA DEV</div><header><h1>GAMA Stock Manager</h1></header><main class="wrap"><h2>Modules</h2><div class="moreGrid" id="gamaDashboardTiles"><button class="tile orange" id="dev-client-catalog-tile" type="button" onclick="alert('Catalogue client — module DEV')"><span class="tileIcon">🛍️</span><span class="badge">NUEVO</span><span class="title">Catalogue client</span><span class="desc">Produits disponibles à la vente</span></button><button class="tile teal" id="dev-client-requests-tile" type="button" onclick="alert('Demandes clients — module DEV')"><span class="tileIcon">📥</span><span class="badge">NUEVO</span><span class="title">Demandes clients</span><span class="desc">Demandes de commande reçues</span></button></div></main></body></html>
