<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAMA Stock Manager — DEV</title></head><body><script>
(async function(){
 const PROD='https://lisciandraj.github.io/Pro-manager-Gama/';
 const RAW='https://raw.githubusercontent.com/lisciandraj/Pro-manager-Gama/main/index.html?dev=20260830-16';
 const res=await fetch(RAW,{cache:'no-store'}); if(!res.ok) throw Error('Impossible de charger GAMA de référence');
 let html=await res.text();
 const devStyle=`<style id="gamaDevClientTiles">\n.gamaDevClientTile{position:relative;background:#fff!important;border:1px solid #E2E8EC!important;border-radius:14px!important;min-height:138px!important;padding:14px 10px 12px!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:7px!important;color:#173246!important;box-shadow:0 3px 13px #1732460b!important;cursor:pointer!important}.gamaDevClientIcon{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:32px}.gamaDevClientIcon.orange{background:#FFF0E7}.gamaDevClientIcon.teal{background:#E8F5F6}.gamaDevClientTile b{font-size:14px;line-height:1.15;text-align:center}.gamaDevClientTile small{font-size:10px;color:#71808A;text-align:center;line-height:1.2}.gamaDevNewBadge{position:absolute;right:9px;top:9px;padding:4px 8px;border-radius:999px;background:#F47A2A;color:#fff;font-size:9px;font-weight:900}.gamaDevClientTile.tealTile .gamaDevNewBadge{background:#087C8B}@media(max-width:700px){.gamaDevClientTile{min-height:118px!important;padding:10px 5px!important;border-radius:12px!important}.gamaDevClientIcon{width:47px;height:47px;border-radius:13px;font-size:26px}.gamaDevClientTile b{font-size:12px}.gamaDevClientTile small{font-size:9px}}\n</style>`;
 html=html.replace(/<\/head>/i,devStyle+'</head>');
 const tiles=`\n    <button id="dev-client-catalog-tile" class="appTile gamaDevClientTile orangeTile" type="button" onclick="window.showTab('gama-dev-client-catalog',null)"><span class="appIcon orange gamaDevClientIcon">🛍️</span><span class="gamaDevNewBadge">NUEVO</span><b>Catalogue client</b><small>Produits disponibles à la vente</small></button>\n    <button id="dev-client-requests-tile" class="appTile gamaDevClientTile tealTile" type="button" onclick="window.showTab('gama-dev-client-requests',null)"><span class="appIcon teal gamaDevClientIcon">📥</span><span class="gamaDevNewBadge">NUEVO</span><b>Demandes clients</b><small>Demandes de commande reçues</small></button>\n`;
 const marker='<div class="menuFooter">';
 if(!html.includes(marker)) throw Error('Zone du menu GAMA introuvable');
 html=html.replace(marker,tiles+'\n  '+marker);
 const sections=`\n<section id="gama-dev-client-catalog"><div class="card"><h2>🛍️ Catalogue client</h2><p class="muted">Catalogue des produits disponibles à la vente.</p><div id="gamaDevCatalogList"></div></div></section>\n<section id="gama-dev-client-requests"><div class="card"><h2>📥 Demandes clients</h2><p class="muted">Demandes de commande reçues des clients.</p><div id="gamaDevRequestsList"><p class="muted">Aucune demande client pour le moment.</p></div></div></section>\n`;
 html=html.replace('</body>',sections+'</body>');
 const extra=`<script id="gamaDevBoot">\n(function(){const P='${PROD}';document.documentElement.dataset.gamaDev='true';document.documentElement.dataset.gamaDevBuild='20260830-16';const oldShow=window.showTab;function boot(){const cat=document.getElementById('gama-dev-client-catalog');const req=document.getElementById('gama-dev-client-requests');if(cat)cat.style.display='none';if(req)req.style.display='none';const tiles=['dev-client-catalog-tile','dev-client-requests-tile'];if(tiles.every(id=>document.getElementById(id))){console.info('GAMA DEV: 2/2 tuiles client présentes dans le HTML');}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();})();\n</script>`;
 html=html.replace('</body>',extra+'</body>');
 html=html.replace(/<head>/i,'<head><base href="'+PROD+'">');
 html=html.replace(/<body([^>]*)>/i,'<body$1><div style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#B45309;color:#fff;text-align:center;padding:8px;font:900 11px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">🧪 ENVIRONNEMENT DE DÉVELOPPEMENT · GAMA DEV · BUILD 2026-08-30-16</div>');
 document.open();document.write(html);document.close();
})().catch(e=>{document.body.innerHTML='<div style="padding:30px;font-family:Arial;color:#9b3e35"><b>Erreur GAMA DEV</b><br>'+e.message+'</div>'});
</script></body></html>
