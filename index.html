<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087C8B">
<title>GAMA Stock Manager — DEV</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#gamaDevBanner{height:34px;box-sizing:border-box;background:#B95708;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:.15px;padding:0 8px;position:relative;z-index:10}
#gamaFrame{display:block;width:100%;height:calc(100% - 34px);border:0;background:#F5F7FA}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#F5F7FA;color:#18324A;font-weight:800;z-index:20}
#boot small{display:block;margin-top:8px;color:#71808A;font-weight:500;text-align:center}
#boot.err{padding:30px;text-align:center}
</style>
</head>
<body>
<div id="gamaDevBanner">🧪 GAMA DEV 33 · Catalogue client · Demandes clients</div>
<div id="boot">Chargement de GAMA DEV<small>Ouverture de l'application principale…</small></div>
<iframe id="gamaFrame" title="GAMA Stock Manager DEV" src="../Pro-manager-Gama/?dev=20260830-33"></iframe>
<script>
(function(){
 const boot=document.getElementById('boot'),frame=document.getElementById('gamaFrame');
 const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\"':'&quot;'}[c]));
 function products(){try{const x=JSON.parse(frame.contentWindow.localStorage.getItem('stock_manager_v6_ecuador')||'{}');return Array.isArray(x.products)?x.products:[]}catch(e){return[]}}
 function requests(){try{return JSON.parse(frame.contentWindow.localStorage.getItem('gama_client_requests_v1')||'[]')}catch(e){return[]}}
 function show(id){const w=frame.contentWindow;w.document.querySelectorAll('section').forEach(s=>s.classList.remove('active'));const s=w.document.getElementById(id);if(s)s.classList.add('active');const back=w.document.getElementById('globalBack');if(back)back.style.display='grid';w.scrollTo(0,0)}
 function renderCatalog(){const w=frame.contentWindow,r=w.document.getElementById('gamaDevProducts');if(!r)return;const ps=products();r.innerHTML=ps.length?ps.map((p,i)=>{const n=p.name||'Produit',im=p.photo||'',price=Number(p.price||0);return '<article class="gamaDevProduct">'+(im?'<img src="'+esc(im)+'" alt="'+esc(n)+'">':'<div class="gamaDevNoImg">📦</div>')+'<h3>'+esc(n)+'</h3><p>Réf. '+esc(p.ref||p.barcode||'')+'</p><p><strong>$'+price.toFixed(2)+'</strong></p><button class="primary" data-add="'+i+'">Ajouter</button></article>'}).join(''):'<div class="notice">Aucun produit disponible dans GAMA.</div>';r.querySelectorAll('[data-add]').forEach(b=>b.onclick=function(){const ps=products();const cart=JSON.parse(sessionStorage.getItem('gama_dev_cart')||'{}');cart[b.dataset.add]=(cart[b.dataset.add]||0)+1;sessionStorage.setItem('gama_dev_cart',JSON.stringify(cart));renderCart(ps)}) ;renderCart(ps)}
 function renderCart(ps){const w=frame.contentWindow,r=w.document.getElementById('gamaDevCartBody');if(!r)return;const cart=JSON.parse(sessionStorage.getItem('gama_dev_cart')||'{}'),ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length){r.innerHTML='<b>Votre demande</b><p class="muted">Ajoutez des produits au panier.</p>';return}r.innerHTML='<h3>Votre demande</h3>'+ids.map(i=>'<div class="gamaDevLine"><span>'+esc(ps[i]?.name||'Produit')+'</span><input type="number" min="1" value="'+cart[i]+'" data-q="'+i+'"><button class="secondary" data-r="'+i+'">Retirer</button></div>').join('')+'<div class="row" style="margin-top:10px"><input id="gamaClientName" placeholder="Nom / société"><input id="gamaClientEmail" type="email" placeholder="E-mail"></div><textarea id="gamaClientNote" placeholder="Commentaire" style="margin-top:8px"></textarea><button class="primary" id="gamaSendRequest" style="margin-top:8px">Envoyer la demande</button>';r.querySelectorAll('[data-q]').forEach(x=>x.onchange=function(){cart[x.dataset.q]=Math.max(1,Number(x.value)||1);sessionStorage.setItem('gama_dev_cart',JSON.stringify(cart))});r.querySelectorAll('[data-r]').forEach(x=>x.onclick=function(){delete cart[x.dataset.r];sessionStorage.setItem('gama_dev_cart',JSON.stringify(cart));renderCart(ps)});r.querySelector('#gamaSendRequest').onclick=function(){const customer=w.document.getElementById('gamaClientName').value.trim(),email=w.document.getElementById('gamaClientEmail').value.trim();if(!customer||!email)return w.alert('Nom / société et e-mail requis.');const a=requests();a.unshift({id:'REQ-'+Date.now(),date:new Date().toISOString(),customer,email,note:w.document.getElementById('gamaClientNote').value,items:ids.map(i=>({product:ps[i]?.name||'Produit',qty:cart[i],price:Number(ps[i]?.price||0)})),status:'Nouvelle'});w.localStorage.setItem('gama_client_requests_v1',JSON.stringify(a));sessionStorage.removeItem('gama_dev_cart');w.alert('Demande envoyée avec succès.');renderCatalog()}}
 function renderRequests(){const w=frame.contentWindow,r=w.document.getElementById('gamaDevRequests');if(!r)return;const a=requests();r.innerHTML=a.length?a.map(x=>'<div class="card"><b>'+esc(x.customer)+'</b> <span class="badge">'+esc(x.status)+'</span><p class="muted">'+esc(x.email)+' · '+new Date(x.date).toLocaleString('fr-BE')+'</p>'+x.items.map(i=>'<div class="gamaDevLine"><span>'+esc(i.product)+'</span><span>× '+i.qty+'</span><b>$'+Number(i.price||0).toFixed(2)+'</b></div>').join('')+(x.note?'<p>'+esc(x.note)+'</p>':'')+'</div>').join(''):'<div class="notice">Aucune demande client.</div>'}
 function install(){
  const w=frame.contentWindow,d=w.document;if(!d.body||!d.getElementById('mainmenu'))throw Error('Menu GAMA introuvable');
  const style=d.createElement('style');style.textContent='.gamaDevTile{position:relative!important}.gamaDevBadge{position:absolute;right:8px;top:8px;padding:4px 7px;border-radius:999px;background:#F47A2A;color:#fff;font-size:9px;font-weight:900}.gamaDevProducts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gamaDevProduct{background:#fff;border:1px solid var(--gama-line,#E2E8EC);border-radius:14px;padding:12px;box-shadow:0 3px 13px #1732460b}.gamaDevProduct img,.gamaDevNoImg{width:100%;height:150px;object-fit:contain;background:#F4F7F8;border-radius:10px}.gamaDevNoImg{display:grid;place-items:center;font-size:40px}.gamaDevProduct h3{margin:8px 0 4px}.gamaDevProduct p{margin:3px 0;color:#71808A;font-size:11px}.gamaDevLine{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #EDF1F2}.gamaDevCart{margin-top:14px}@media(max-width:700px){.gamaDevProducts{grid-template-columns:1fr 1fr}.gamaDevProduct img,.gamaDevNoImg{height:105px}}';d.head.appendChild(style);
  const menu=d.getElementById('mainmenu'),footer=menu.querySelector('.menuFooter');
  if(!d.getElementById('clientCatalogTile'))footer.insertAdjacentHTML('beforebegin','<button class="appTile gamaDevTile" id="clientCatalogTile" type="button"><span class="appIcon orange">🛍️</span><span class="gamaDevBadge">NOUVEAU</span><b>Catalogue client</b><small>Produits disponibles à la vente</small></button><button class="appTile gamaDevTile" id="clientRequestsTile" type="button"><span class="appIcon teal">📥</span><span class="gamaDevBadge">NOUVEAU</span><b>Demandes clients</b><small>Demandes de commande reçues</small></button>');
  if(!d.getElementById('clientCatalog'))d.querySelector('.wrap').insertAdjacentHTML('afterbegin','<section id="clientCatalog"><div class="pageBack"><button id="clientCatalogBack" type="button">‹ Menú principal</button></div><div class="card"><h2>🛍️ Catalogue client</h2><p class="muted">Produits disponibles à la vente</p><div id="gamaDevProducts" class="gamaDevProducts"></div><div class="card gamaDevCart"><div id="gamaDevCartBody"><b>Votre demande</b><p class="muted">Ajoutez des produits au panier.</p></div></div></div></section><section id="clientRequests"><div class="pageBack"><button id="clientRequestsBack" type="button">‹ Menú principal</button></div><div class="card"><h2>📥 Demandes clients</h2><p class="muted">Demandes de commande reçues</p><div id="gamaDevRequests"></div></div></section>');
  d.getElementById('clientCatalogTile').onclick=function(){show('clientCatalog');renderCatalog()};d.getElementById('clientRequestsTile').onclick=function(){show('clientRequests');renderRequests()};d.getElementById('clientCatalogBack').onclick=function(){w.showTab('mainmenu',null)};d.getElementById('clientRequestsBack').onclick=function(){w.showTab('mainmenu',null)};
  boot.style.display='none';
 }
 frame.addEventListener('load',function(){try{install()}catch(e){boot.className='err';boot.innerHTML='<div><h2>Erreur GAMA DEV</h2><p>'+esc(e.message||e)+'</p><small>Vérifie que le dépôt GAMA principal est bien publié.</small></div>'}});
 setTimeout(function(){if(boot.style.display!=='none'){boot.className='err';boot.innerHTML='<div><h2>GAMA DEV ne répond pas</h2><p>Le dépôt principal n’a pas terminé son chargement.</p><button onclick="location.reload()" style="padding:12px;border:0;border-radius:9px;background:#087C8B;color:#fff">Recharger</button></div>'}},15000);
})();
</script>
</body>
</html>
