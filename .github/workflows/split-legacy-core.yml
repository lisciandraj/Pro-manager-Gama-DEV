name: Split GAMA legacy core

on:
  push:
    paths:
      - 'scripts/split-legacy-core.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Split legacy core
        run: node scripts/split-legacy-core.mjs
      - name: Remove obsolete core loader references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="gama-legacy-core.js?v=1"></script>\n','')
          p.write_text(s)
          PY
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gama-legacy-core.js gama-legacy-runtime.js gama-products.js gama-clients.js gama-inventory.js gama-billing.js gama-audit.js gama-dashboard.js index.html
          git diff --cached --quiet || (git commit -m "refactor: move legacy core into bounded contexts" && git push)
