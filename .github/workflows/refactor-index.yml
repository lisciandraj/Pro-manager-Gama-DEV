name: Refactor legacy index

on:
  push:
    paths:
      - 'scripts/refactor-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Refactor index.html
        run: node scripts/refactor-index.mjs

      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No refactor changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html gama-core.css
          git commit -m "refactor: extract legacy index CSS and JS"
          git push
