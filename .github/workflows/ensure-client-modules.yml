name: Ensure client modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch index navigation and cache versions
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='index.html';
          let h=fs.readFileSync(p,'utf8');
          h=h.replace(/gama-menu-final2\.js\?v=\d+/,'gama-menu-final2.js?v=10');
          h=h.replace(/gama-excel-module-loader\.js\?v=\d+/,'gama-excel-module-loader.js?v=11');
          h=h.replace(/gama-excel-import\.js\?v=\d+/,'gama-excel-import.js?v=9');
          if(!h.includes('gama-client-catalog.js?v=7')){
            h=h.replace(/(gama-menu-final2\.js\?v=10)/,'gama-client-catalog.js?v=7\n<script src="gama-customer-requests.js?v=4"></script>\n<script src="$1</script>');
          }
          fs.writeFileSync(p,h);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: refresh Excel importer" && git push)
