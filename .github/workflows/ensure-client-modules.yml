name: Ensure client modules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch index navigation
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='index.html';
          let h=fs.readFileSync(p,'utf8');
          const marker='<script src="gama-menu-final2.js?v=6"></script>';
          const tags='<script src="gama-client-catalog.js?v=7"></script>\n<script src="gama-customer-requests.js?v=4"></script>\n'+marker;
          if(!h.includes('gama-client-catalog.js?v=7')) h=h.replace(marker,tags);
          fs.writeFileSync(p,h);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "fix: preload catalog and customer requests" && git push)
