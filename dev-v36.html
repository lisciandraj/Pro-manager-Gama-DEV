<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GAMA DEV V36</title><style>html,body{margin:0;height:100%;background:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.bar{height:42px;display:flex;align-items:center;justify-content:center;background:#B95708;color:#fff;font-weight:800;font-size:12px;text-align:center;padding:0 8px;box-sizing:border-box}.frame{width:100%;height:calc(100% - 42px);border:0;display:block}.boot{position:fixed;inset:42px 0 0;display:grid;place-items:center;background:#F5F7FA;color:#18324A;font-weight:800;z-index:5}.boot small{display:block;margin-top:8px;color:#71808A;font-weight:500}.hidden{display:none!important}</style></head><body><div class="bar">🧪 ENVIRONNEMENT DE DÉVELOPPEMENT · GAMA DEV V36 · Catalogue client + Demandes clients</div><div id="boot" class="boot">Chargement de GAMA DEV<small>Ouverture de GAMA Stock Manager…</small></div><iframe id="app" class="frame" src="https://lisciandraj.github.io/Pro-manager-Gama/?dev=36" title="GAMA Stock Manager DEV"></iframe><script>(function(){const f=document.getElementById('app'),b=document.getElementById('boot');function install(){const d=f.contentDocument,w=f.contentWindow;if(!d||!d.body)throw Error('GAMA principal non chargé');if(!d.getElementById('mainmenu'))throw Error('Menu GAMA introuvable');const st=d.createElement('style');st.textContent='.gamaDevTile{position:relative!important}.gamaDevBadge{position:absolute;right:10px;top:10px;background:#F47A2A;color:#fff;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:900}.gamaDevTile.teal .gamaDevBadge{background:#087C8B}.gamaDevPages{display:none}.gamaDevPages.active{display:block}.gamaDevProducts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.gamaDevProduct{background:#fff;border:1px solid var(--gama-line,#E2E8EC);border-radius:14px;padding:12px}.gamaDevProduct img,.gamaDevNoImg{width:100%;height:120px;object-fit:contain;border-radius:10px;background:#F4F7F8}.gamaDevNoImg{display:grid;place-items:center;font-size:38px}.gamaDevProduct h3{margin:8px 0 4px}.gamaDevProduct p{margin:3px 0;color:#71808A;font-size:11px}.gamaDevLine{display:grid;grid-template-columns:1fr 65px auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #EDF1F2}.gamaDevCart{margin-top:14px}@media(max-width:700px){.gamaDevProducts{grid-template-columns:1fr 1fr}.gamaDevProduct img,.gamaDevNoImg{height:100px}}';d.head.appendChild(st);const menu=d.getElementById('mainmenu');let grid=menu.querySelector('.appGrid')||menu.querySelector('.moreGrid')||menu.querySelector('[class*="Grid"]');if(!grid)throw Error('Grille du menu GAMA introuvable');if(!d.getElementById('clientCatalogTile'))grid.insertAdjacentHTML('afterbegin','<button class="appTile gamaDevTile" id="clientCatalogTile" type="button"><span class="appIcon orange">🛍️</span><span class="gamaDevBadge">NOUVEAU</span><b>Catalogue client</b><small>Produits disponibles à la vente</small></button><button class="appTile gamaDevTile teal" id="clientRequestsTile" type="button"><span class="appIcon teal">📥</span><span class="gamaDevBadge">NOUVEAU</span><b>Demandes clients</b><small>Demandes de commande reçues</small></button>');let anchor=d.querySelector('#mainmenu .wrap');if(!anchor)anchor=d.body;if(!d.getElementById('clientCatalog'))anchor.insertAdjacentHTML('beforeend','<section id="clientCatalog" class="gamaDevPages"><div class="wrap"><div class="card"><h2>🛍️ Catalogue client</h2><p class="muted">Produits disponibles à la vente</p><div id="gamaDevProducts" class="gamaDevProducts"></div><div class="card gamaDevCart"><div id="gamaDevCartBody"><b>Votre demande</b><p class="muted">Ajoutez des produits au panier.</p></div></div><button class="secondary" id="clientCatalogBack">‹ Menu principal</button></div></div></section><section id="clientRequests" class="gamaDevPages"><div class="wrap"><div class="card"><h2>📥 Demandes clients</h2><p class="muted">Demandes de commande reçues</p><div id="gamaDevRequests"></div><button class="secondary" id="clientRequestsBack">‹ Menu principal</button></div></div></section>');function data(){try{const x=JSON.parse(w.localStorage.getItem('stock_manager_v6_ecuador')||'{}');return Array.isArray(x.products)?x.products:[]}catch(e){return[]}}function show(id){d.querySelectorAll('section').forEach(s=>s.classList.remove('active'));const x=d.getElementById(id);if(x)x.classList.add('active');w.scrollTo(0,0)}function catalog(){const ps=data(),r=d.getElementById('gamaDevProducts');if(!r)return;r.innerHTML=ps.length?ps.map((p,i)=>'<article class="gamaDevProduct">'+(p.photo?'<img src="'+p.photo+'">':'<div class="gamaDevNoImg">📦</div>')+'<h3>'+String(p.name||'Produit')+'</h3><p>Réf. '+String(p.ref||p.barcode||'')+'</p><p><strong>$'+Number(p.price||0).toFixed(2)+'</strong></p><button class="primary" data-add="'+i+'">Ajouter</button></article>').join(''):'<div class="notice">Aucun produit disponible.</div>';r.querySelectorAll('[data-add]').forEach(x=>x.onclick=()=>{const c=JSON.parse(w.sessionStorage.getItem('gama_dev_cart')||'{}');c[x.dataset.add]=(c[x.dataset.add]||0)+1;w.sessionStorage.setItem('gama_dev_cart',JSON.stringify(c));cart(ps)});cart(ps)}function cart(ps){const r=d.getElementById('gamaDevCartBody'),c=JSON.parse(w.sessionStorage.getItem('gama_dev_cart')||'{}'),ids=Object.keys(c).filter(i=>c[i]>0);if(!ids.length){r.innerHTML='<b>Votre demande</b><p class="muted">Ajoutez des produits au panier.</p>';return}r.innerHTML='<h3>Votre demande</h3>'+ids.map(i=>'<div class="gamaDevLine"><span>'+String(ps[i].name||'Produit')+'</span><input type="number" min="1" value="'+c[i]+'" data-q="'+i+'"><button class="secondary" data-r="'+i+'">Retirer</button></div>').join('')+'<input id="gamaClientName" placeholder="Nom / société" style="margin-top:10px"><input id="gamaClientEmail" placeholder="E-mail" type="email" style="margin-top:8px"><textarea id="gamaClientNote" placeholder="Commentaire" style="margin-top:8px"></textarea><button class="primary" id="gamaSendRequest" style="margin-top:8px">Envoyer la demande</button>';r.querySelectorAll('[data-q]').forEach(x=>x.onchange=()=>{c[x.dataset.q]=Math.max(1,Number(x.value)||1);w.sessionStorage.setItem('gama_dev_cart',JSON.stringify(c))});r.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{delete c[x.dataset.r];w.sessionStorage.setItem('gama_dev_cart',JSON.stringify(c));cart(ps)});d.getElementById('gamaSendRequest').onclick=()=>{const a=JSON.parse(w.localStorage.getItem('gama_client_requests_v1')||'[]');a.unshift({id:'REQ-'+Date.now(),date:new Date().toISOString(),customer:d.getElementById('gamaClientName').value,email:d.getElementById('gamaClientEmail').value,note:d.getElementById('gamaClientNote').value,items:ids.map(i=>({product:ps[i].name,qty:c[i],price:Number(ps[i].price||0)})),status:'Nouvelle'});w.localStorage.setItem('gama_client_requests_v1',JSON.stringify(a));w.sessionStorage.removeItem('gama_dev_cart');w.alert('Demande envoyée avec succès.');catalog()}}function requests(){const r=d.getElementById('gamaDevRequests'),a=JSON.parse(w.localStorage.getItem('gama_client_requests_v1')||'[]');r.innerHTML=a.length?a.map(x=>'<div class="card"><b>'+x.customer+'</b> <span class="badge">'+x.status+'</span><p class="muted">'+x.email+'</p>'+x.items.map(i=>'<div class="gamaDevLine"><span>'+i.product+'</span><span>× '+i.qty+'</span><b>$'+Number(i.price||0).toFixed(2)+'</b></div>').join('')+'</div>').join(''):'<div class="notice">Aucune demande client.</div>'}d.getElementById('clientCatalogTile').onclick=()=>{show('clientCatalog');catalog()};d.getElementById('clientRequestsTile').onclick=()=>{show('clientRequests');requests()};d.getElementById('clientCatalogBack').onclick=()=>show('mainmenu');d.getElementById('clientRequestsBack').onclick=()=>show('mainmenu');b.classList.add('hidden')}f.addEventListener('load',()=>{try{install()}catch(e){b.innerHTML='<div><b>Erreur GAMA DEV</b><small>'+String(e.message||e)+'</small></div>'}});setTimeout(()=>{if(!b.classList.contains('hidden'))b.innerHTML='<div><b>GAMA DEV : chargement trop long</b><small>Le dépôt GAMA principal ne répond pas.</small></div>'},15000)})();</script></body></html>
