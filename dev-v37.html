<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAMA DEV V37</title>
<style>
html,body{margin:0;height:100%;background:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;background:#F5F7FA;color:#18324A;font-weight:800;font-size:22px;text-align:center}.boot small{display:block;margin-top:10px;color:#71808A;font-weight:500;font-size:13px}
</style>
</head>
<body>
<div id="boot" class="boot"><div>Cargando GAMA DEV<small>Preparando la versión de desarrollo…</small></div></div>
<script>
(async()=>{
 const boot=document.getElementById('boot');
 try{
   const mainUrl='https://lisciandraj.github.io/Pro-manager-Gama/?dev=37&v=37';
   const r=await fetch(mainUrl,{cache:'no-store'});
   if(!r.ok) throw new Error('No se pudo cargar GAMA principal ('+r.status+')');
   let html=await r.text();
   const base='<base href="https://lisciandraj.github.io/Pro-manager-Gama/">';
   const devStyle='<style id="gamaDevBannerStyle">#gamaDevBanner{position:relative;z-index:99999;min-height:42px;display:flex;align-items:center;justify-content:center;background:#B95708;color:#fff;font-weight:800;font-size:12px;text-align:center;padding:7px 10px;box-sizing:border-box}body.gamaDevLoaded{padding-top:0!important}</style>';
   const banner='<div id="gamaDevBanner">🧪 ENTORNO DE DESARROLLO · GAMA DEV V37 · Catálogo de clientes + Solicitudes de clientes</div>';
   const module='<script src="https://lisciandraj.github.io/Pro-manager-Gama-DEV/gama-client-modules.js?v=37"><\/script>';
   html=html.replace('<head>','<head>'+base+devStyle);
   html=html.replace('<body>','<body class="gamaDevLoaded">'+banner);
   html=html.replace('</body>',module+'</body>');
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   boot.innerHTML='<div><b>Error GAMA DEV</b><small>'+String(e.message||e)+'</small></div>';
 }
})();
</script>
</body>
</html>
