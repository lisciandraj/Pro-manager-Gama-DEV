<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GAMA DEV V39</title>
<style>
html,body{margin:0;height:100%;background:#F5F7FA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow:hidden}
.bar{height:56px;display:flex;align-items:center;justify-content:center;background:#B95708;color:#fff;font-weight:800;font-size:13px;text-align:center;padding:0 12px;box-sizing:border-box}
.frame{width:100%;height:calc(100vh - 56px);border:0;display:block;background:#F5F7FA}
.boot{position:fixed;inset:56px 0 0;display:grid;place-items:center;background:#F5F7FA;color:#18324A;font-weight:800;font-size:22px;z-index:10}.boot small{display:block;margin-top:9px;color:#71808A;font-weight:500;font-size:13px;text-align:center}.hidden{display:none!important}
</style>
</head>
<body>
<div class="bar">🧪 ENTORNO DE DESARROLLO · GAMA DEV V39 · Catálogo de clientes + Solicitudes de clientes</div>
<div id="boot" class="boot">Cargando GAMA DEV<small>Inicializando GAMA y los módulos de clientes…</small></div>
<iframe id="app" class="frame" src="https://lisciandraj.github.io/Pro-manager-Gama/?dev=39&amp;v=39" title="GAMA Stock Manager DEV"></iframe>
<script>
(()=>{
 const frame=document.getElementById('app'),boot=document.getElementById('boot');let injected=false;
 const hide=()=>boot.classList.add('hidden');
 const fail=msg=>{boot.innerHTML='<div><b>Error GAMA DEV</b><small>'+msg+'</small></div>'};
 function inject(){
   if(injected)return true;
   try{
     const d=frame.contentDocument;
     if(!d||!d.body)return false;
     if(d.getElementById('gamaClientModuleScript')){injected=true;hide();return true}
     const s=d.createElement('script');s.id='gamaClientModuleScript';s.src=location.origin+'/Pro-manager-Gama-DEV/gama-client-modules.js?v=39-'+Date.now();
     s.onload=()=>{injected=true;hide()};s.onerror=()=>fail('No se pudo cargar los módulos de clientes.');
     d.body.appendChild(s);return true;
   }catch(e){return false}
 }
 frame.addEventListener('load',()=>{let n=0;const t=setInterval(()=>{n++;if(inject()||n>120)clearInterval(t)},250)});
 setTimeout(()=>{if(!injected)fail('No se pudo inicializar GAMA DEV.')},30000);
})();
</script>
</body>
</html>
